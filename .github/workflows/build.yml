# Builds the NVDA add-on on every push and pull request.
# A release with the .nvda-addon file is made when you: run the workflow by hand with "Publish a release" ticked,
# push a tag like v1.1.0, or publish a release on the website.

name: Build add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand: Actions tab -> Build add-on -> Run workflow.
  # Tick "Publish a release" to create the release (and its tag) from the manifest version.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v + version from addon/manifest.ini)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show repository files
        run: |
          echo "Files in the repository:"
          find . -path ./.git -prune -o -type f -print | sort
          for f in build.py readme.md readme.cs.md addon/manifest.ini addon/globalPlugins/addonStoreSortMemory/__init__.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file $f. All files from the addonStoreSortMemory folder must be in the root of the repository (not inside a subfolder)."
              missing=1
            fi
          done
          [ -z "$missing" ]

      - name: Check Python syntax
        run: python -m compileall -q addon build.py

      - name: Read version from manifest
        id: version
        run: |
          version=$(sed -n 's/^version *= *//p' addon/manifest.ini | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $version"

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${{ steps.version.outputs.version }}. Change 'version' in addon/manifest.ini or use tag v${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Build the add-on
        run: |
          find addon -name __pycache__ -type d -prune -exec rm -rf {} +
          python build.py

      - name: Compute SHA-256 checksum
        id: sha
        run: |
          file=addonStoreSortMemory-${{ steps.version.outputs.version }}.nvda-addon
          sum=$(sha256sum "$file" | cut -d' ' -f1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "SHA-256 of $file: $sum" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.sha.outputs.file }}
          path: ${{ steps.sha.outputs.file }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.sha.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          echo "Release tag: $tag"
          printf '%s\n\n%s\n\nSHA-256: `%s`\n' \
            "NVDA add-on: Add-on Store Sort Memory, version $VERSION." \
            "Download the .nvda-addon file below and open it to install." \
            "$SHA256" > notes.md

          if gh release view "$tag" > /dev/null 2>&1; then
            # The release exists already (made on the website): attach the file to it.
            if gh release upload "$tag" "$FILE" --clobber; then
              echo "Attached $FILE to the existing release $tag." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not attach $FILE to the existing release $tag (see the message above). If the repository uses immutable releases, files cannot be added after a release is published. Delete release $tag and tag $tag on the website, then run this workflow by hand with 'Publish a release' ticked."
              exit 1
            fi
          else
            # gh creates the tag (on this commit) and the release with the file in one go.
            gh release create "$tag" "$FILE" --target "$GITHUB_SHA" \
              --title "Add-on Store Sort Memory $VERSION" --notes-file notes.md
            echo "Created release $tag with $FILE." >> "$GITHUB_STEP_SUMMARY"
          fi
